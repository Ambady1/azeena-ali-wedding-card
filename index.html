<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a1523">
<title>Azeena & Ali | Wedding Invitation</title>
<meta property="og:title" content="Azeena & Ali - Wedding Invitation">
<meta property="og:description" content="Nikkah on Sunday, 17 January 2027, 11:30 AM at Highness Auditorium, Pukkattupady.">
<link rel="preload" href="Resources/firstpage.mp4" as="video" type="video/mp4">
<link rel="preload" href="Resources/firstpage.mp3" as="audio" type="audio/mpeg">
<link rel="preload" href="Resources/animation.mp4" as="video" type="video/mp4">
<link rel="preload" href="Resources/love.MP3" as="audio" type="audio/mpeg">
<link rel="preload" href="Resources/lastpage.png" as="image">
<link rel="preload" href="Resources/writingspace.png" as="image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Monsieur+La+Doulaise&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=14">
</head>
<body class="locked">
<canvas id="petals" aria-hidden="true"></canvas>

<!-- Preloaded audio tracks -->
<audio id="firstpageAudio" src="Resources/firstpage.mp3" loop preload="auto"></audio>
<audio id="loveAudio" src="Resources/love.MP3" preload="auto"></audio>

<!-- Initial screen (firstpage.mp4) -->
<section id="intro" class="intro" role="button" tabindex="0" aria-label="Tap anywhere to open invitation">
  <video id="introVideo" class="intro-video" src="Resources/firstpage.mp4" poster="Resources/firstpage.png" playsinline loop autoplay muted preload="auto"></video>
  <button id="soundToggle" class="sound-toggle" type="button" aria-label="Toggle sound">&#128263; Tap for Sound</button>
  <div class="intro-prompt" aria-hidden="true">
    <span>Tap anywhere to open</span>
  </div>
</section>

<!-- Intermediate transition video (animation.mp4) -->
<section id="animSection" class="anim-section" aria-hidden="true">
  <video id="animVideo" class="anim-video" src="Resources/animation.mp4" playsinline preload="auto"></video>
</section>

<!-- Final stage: lastpage.png with typewriter names -->
<main id="card" class="card" aria-hidden="true">
  <div class="card-bg" style="background-image: url('Resources/lastpage.png');"></div>

  <div class="names-stage">
    <h1 class="couple-names" aria-label="Azeena Azeez and Ali Shamsudheen">
      <div class="person-block">
        <span id="brideFirst" class="type-line"></span>
        <span id="brideLast" class="type-line"></span>
      </div>
      <span id="lineAnd" class="type-and"></span>
      <div class="person-block">
        <span id="groomFirst" class="type-line"></span>
        <span id="groomLast" class="type-line"></span>
      </div>
    </h1>
  </div>

  <div id="scrollCue" class="scroll-cue" aria-hidden="true">
    <span class="scroll-text">Scroll</span>
    <svg class="scroll-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3.5v16m0 0l-7-7m7 7l7-7" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</main>

<!-- Event details over writingspace.png -->
<section id="eventDetails" class="event-details" aria-hidden="true">
  <div class="writing-area">
    <div class="reveal-block" data-reveal>
      <p class="scratch-title">Scratch to Reveal Date</p>

      <div class="scratch-card" id="scratchCard">
        <div class="scratch-reveal">
          <div class="scratch-names">Azeena &amp; Ali</div>
          <div class="scratch-divider" aria-hidden="true"></div>
          <div class="scratch-date">Sunday, 17 January 2027</div>
          <div class="scratch-time">11:30 AM</div>
        </div>
        <canvas id="scratchCanvas" aria-label="Scratch to reveal the wedding date"></canvas>
        <div class="scratch-hand" aria-hidden="true">&#9995;&#65039;</div>
      </div>
    </div>

    <div class="reveal-block countdown-block" data-reveal>
      <h2 class="countdown-title">Counting Down to Forever</h2>
      <div class="countdown" id="countdown" role="timer" aria-label="Countdown to the wedding">
        <div class="count-unit">
          <span id="countDays" class="count-value">00</span>
          <span class="count-label">Days</span>
        </div>
        <div class="count-unit">
          <span id="countHours" class="count-value">00</span>
          <span class="count-label">Hours</span>
        </div>
        <div class="count-unit">
          <span id="countMinutes" class="count-value">00</span>
          <span class="count-label">Minutes</span>
        </div>
        <div class="count-unit">
          <span id="countSeconds" class="count-value">00</span>
          <span class="count-label">Seconds</span>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="script.js?v=14"></script>
</body>
</html>
